name: respire
version: 0.1.10
description: "Encrypted Respire memory through local Runtime RPC. Hermes hooks drive recall, reviewed storage, and process diaries."
requires_hermes: ">=0.23.2"
platforms:
  - linux
  - macos
hooks:
  - pre_llm_call
  - pre_tool_call
  - system_prompt_block
  - prefetch
  - queue_prefetch
  - sync_turn
  - on_session_end
  - shutdown
