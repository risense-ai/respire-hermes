name: release

# 通路（与 respire-zcode 同一口径）：
# - push main / PR 到 main：只跑 validate（结构/清单/可编译/fail-open/敏感扫描）。
# - push 形如 *.*.* 的 tag：validate + package，自动建 GitHub Release 并上传 zip。
# - workflow_dispatch：validate + package（只上传 artifact，不建 release），用于全链演练。
# 说明：tests/test_provider.py 不进 CI——引擎段依赖本机 rsrs 引擎与 runtime，
# 无引擎环境只跑桩段（validate 已覆盖），全量测试留给有引擎的开发机。

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: '结构/清单/可编译/fail-open/敏感扫描自检'
        run: python3 scripts/validate_plugin.py

  package:
    needs: validate
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 'tag 须等于 plugin.yaml version'
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(python3 -c "import re; print(re.search(r'^version:\s*(\S+)\s*$', open('plugin.yaml').read(), re.M).group(1))")"
          if [ "${TAG}" != "${VER}" ]; then
            echo "tag ${TAG} != plugin.yaml version ${VER}" >&2
            exit 1
          fi

      - name: '按共用口径打包'
        id: pkg
        run: |
          bash scripts/package.sh > pkg.out
          ZIP_PATH="$(sed -n 1p pkg.out)"
          ZIP_SHA="$(sed -n 2p pkg.out)"
          test -s "${ZIP_PATH}"
          echo "zip=${ZIP_PATH}" >> "${GITHUB_OUTPUT}"
          echo "sha=${ZIP_SHA}" >> "${GITHUB_OUTPUT}"
          echo "zipname=$(basename "${ZIP_PATH}")" >> "${GITHUB_OUTPUT}"
          rm -f pkg.out

      - name: '建 Release 并上传（仅 tag）'
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(mktemp)"
          {
            echo "自动打包产物（构建基线 commit ${GITHUB_SHA}）。"
            echo
            echo '- asset: '"${{ steps.pkg.outputs.zipname }}"
            echo '- sha256: '"${{ steps.pkg.outputs.sha }}"
            echo '- 包结构：zip 根=插件根（__init__.py/plugin.yaml 在根）'
            echo '- 安装：解压到 $HERMES_HOME/plugins/respire/（或仓库 scripts/install.sh），然后 hermes memory setup 选 respire'
            echo '- 引擎（rsrs CLI）缺失时 provider 会在 system prompt 注入装法（npm i -g rsrs-cli@1.0.16）'
          } > "${NOTES}"
          gh release create "${GITHUB_REF_NAME}" "${{ steps.pkg.outputs.zip }}" \
            --target "${GITHUB_SHA}" \
            --title "respire-hermes ${GITHUB_REF_NAME}" \
            --notes-file "${NOTES}" \
            || gh release upload "${GITHUB_REF_NAME}" "${{ steps.pkg.outputs.zip }}" --clobber
          rm -f "${NOTES}"

      - name: '上传构建 artifact（仅 dispatch 演练）'
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: plugin-zip
          path: dist/*.zip
          if-no-files-found: error

  cleanup-receipt:
    needs: [validate, package]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Record the completed producer and delivery inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/cleanup_artifacts.py stamp
      - uses: actions/upload-artifact@v4
        with:
          name: cleanup-ready-v1
          path: ${{ runner.temp }}/cleanup-ready.json
          retention-days: 1
          if-no-files-found: ignore
